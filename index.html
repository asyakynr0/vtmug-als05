
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#176b45">
  <title>Yeşil Market - Akıllı Sepet</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <header class="header">
    <div class="logo">Y</div>
    <div>
      <h1>Yeşil Market</h1>
      <p>Akıllı alışveriş asistanınız</p>
    </div>
  </header>

  <main class="container">
    <section class="welcome">
      <h2>Alışverişini kolaylaştır!</h2>
      <p>Ürün barkodunu okut, fiyatını öğren ve sepetini hesapla.</p>
    </section>

    <section class="card">
      <h3>Tarama modu</h3>

      <div class="buttons">
        <button id="singleMode" class="active">Tekli Sorgu</button>
        <button id="basketMode">Sepet Modu</button>
      </div>

      <video id="camera" autoplay playsinline hidden></video>

      <button id="startCamera" class="primary">
        Kamerayı Başlat
      </button>

      <p id="message">Barkod okutabilir veya elle girebilirsin.</p>

      <form id="barcodeForm">
        <label for="barcode">Barkod numarası</label>
        <div class="input-row">
          <input id="barcode" type="text"
            inputmode="numeric" placeholder="Barkodu gir"
            required>
          <button type="submit" class="primary">Sorgula</button>
        </div>
      </form>
    </section>

    <section class="card" id="result">
      <h3>Ürün bilgisi</h3>
      <p>Henüz ürün sorgulanmadı.</p>
    </section>

    <section class="card" id="basket" hidden>
      <h3>Alışveriş sepetim</h3>
      <div id="basketItems"></div>
      <h2>Toplam: <span id="total">0,00 TL</span></h2>
      <button id="clearBasket" class="secondary">Sepeti temizle</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
